<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c9aff"/>
      <stop offset="1" stop-color="#2f6feb"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    .dot { transform-origin: 120px 70px; animation: pulse 1.6s ease-in-out infinite; }
  </style>
  <rect width="240" height="140" rx="16" fill="#0e1116"/>
  <circle class="dot" cx="120" cy="70" r="34" fill="url(#g)"/>
  <text x="120" y="122" text-anchor="middle" fill="#9aa4b2" font-family="system-ui, sans-serif" font-size="12">same-dir image</text>
</svg>
